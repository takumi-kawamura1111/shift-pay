<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="給与見込み">
  <title>給与見込み計算</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="app-title">給与見込み計算</span>
    <button class="icon-btn gear" id="openSettings" aria-label="設定">⚙︎</button>
  </header>

  <main>
    <section class="card total-card">
      <div class="total-caption">給与の目安</div>
      <div class="total-amount" id="totalAmount">¥0</div>
      <div class="total-sub" id="totalSub"></div>
    </section>

    <section class="card">
      <div class="field">
        <span>出勤日数</span>
        <div class="stepper">
          <button type="button" data-target="days" data-step="-1">−</button>
          <input type="number" id="days" inputmode="numeric" min="0" step="1" value="0">
          <button type="button" data-target="days" data-step="1">＋</button>
        </div>
      </div>
      <div class="field">
        <span>コマ数</span>
        <div class="stepper">
          <button type="button" data-target="koma" data-step="-1">−</button>
          <input type="number" id="koma" inputmode="numeric" min="0" step="1" value="0">
          <button type="button" data-target="koma" data-step="1">＋</button>
        </div>
      </div>
      <label class="field">
        <span>会議の時間（分）<small>その月の合計</small></span>
        <input type="number" id="meetingMin" inputmode="numeric" min="0" step="5" value="0">
      </label>
    </section>

    <section class="card">
      <h2>内訳</h2>
      <dl class="breakdown" id="breakdown"></dl>
      <p class="muted small">税金・社会保険料は引いていない目安です。</p>
    </section>
  </main>

  <!-- 設定 -->
  <dialog id="settingsDialog" class="sheet">
    <form id="settingsForm" method="dialog">
      <div class="sheet-head">
        <button type="button" class="text-btn" data-close>キャンセル</button>
        <h3>設定</h3>
        <button type="submit" class="text-btn strong">保存</button>
      </div>
      <div class="sheet-body">
        <h4>授業</h4>
        <label class="field"><span>授業の時給（円）</span>
          <input type="number" name="lessonHourly" inputmode="numeric" min="0"></label>
        <label class="field"><span>1コマの時間（分）</span>
          <input type="number" name="komaMinutes" inputmode="numeric" min="0"></label>
        <p class="small muted" id="komaRatePreview"></p>

        <h4>交通費</h4>
        <label class="field"><span>1日あたりの交通費（往復・円）</span>
          <input type="number" name="commute" inputmode="numeric" min="0"></label>

        <h4>会議給</h4>
        <label class="field"><span>会議の時給（円）</span>
          <input type="number" name="meetingHourly" inputmode="numeric" min="0"></label>

        <h4>事務給</h4>
        <label class="field"><span>金額（円）</span>
          <input type="number" name="office" inputmode="numeric" min="0"></label>
        <div class="segmented">
          <label><input type="radio" name="officeUnit" value="day"><span>出勤1日ごと</span></label>
          <label><input type="radio" name="officeUnit" value="month"><span>1か月ごと</span></label>
        </div>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
